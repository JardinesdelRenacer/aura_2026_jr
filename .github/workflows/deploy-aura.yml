name: Desplegar Aura en VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Actualizar produccion
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo publicado
        uses: actions/checkout@v4

      - name: Configurar acceso SSH al VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 "root@$VPS_HOST" 'true'

      - name: Instalar, migrar, compilar y reiniciar Aura
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o BatchMode=yes "root@$VPS_HOST" 'bash -s' <<'REMOTE_SCRIPT'
            set -euo pipefail

            sudo -u deploy -H bash -lc '
              set -euo pipefail
              cd /var/www/aura
              git fetch origin main
              git checkout -B main origin/main
              git reset --hard origin/main
              npm ci
              npx prisma migrate deploy
              npm run build
            '

            install -d -o deploy -g deploy /var/www/aura/public/uploads
            systemctl restart aura
            systemctl is-active --quiet aura
            curl --fail --silent --show-error http://127.0.0.1:3001/login > /dev/null
          REMOTE_SCRIPT
